<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MM2 Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(135deg,#0b0b0b,#171717,#202020);

min-height:100vh;
color:white;

}

header{

width:100%;
padding:25px;

background:#111;

box-shadow:0 0 25px rgba(0,0,0,.5);

position:sticky;
top:0;
z-index:999;

}

header h1{

text-align:center;
font-size:38px;

letter-spacing:2px;

color:white;

text-shadow:

0 0 15px #00c3ff,

0 0 30px #00c3ff;

}

.controls{

display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
margin-top:25px;

}

input{

padding:14px 18px;

border:none;

outline:none;

border-radius:12px;

background:#1e1e1e;

color:white;

width:280px;

font-size:16px;

transition:.3s;

}

input:focus{

box-shadow:

0 0 10px #00bfff;

}

select{

padding:14px;

border:none;

outline:none;

border-radius:12px;

background:#1e1e1e;

color:white;

font-size:15px;

cursor:pointer;

}

.container{

max-width:1500px;

margin:auto;

padding:40px;

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(290px,1fr));

gap:28px;

}

.card{

background:#191919;

border-radius:18px;

overflow:hidden;

transition:.35s;

box-shadow:

0 0 20px rgba(0,0,0,.5);

position:relative;

}

.card:hover{

transform:

translateY(-10px)

scale(1.03);

box-shadow:

0 0 30px rgba(0,195,255,.45);

}

.card img{

width:100%;
height:280px;

object-fit:contain;

padding:20px;

background:#141414;

}

.card-content{

padding:20px;

}

.card h2{

font-size:26px;

margin-bottom:10px;

}

.category{

display:inline-block;

padding:6px 12px;

border-radius:30px;

font-size:13px;

margin-bottom:15px;

font-weight:bold;

}

.Unique{

background:#7b7411;

}

.Godly{

background:#ff3c3c;

}

.Ancient{

background:#7a32ff;

}

.Vintage{

background:#ffaa00;

}

.Chroma{

background:linear-gradient(
90deg,
#ff3b3b,
#ff9800,
#ffe600,
#4caf50,
#00bfff,
#7a32ff,
#ff3b3b
);

background-size:400%;

animation:chroma 5s linear infinite;

color:white;

}

.price{

font-size:20px;

margin:12px 0;

font-weight:bold;

color:#00e676;

}

.code{

font-size:17px;

color:#ddd;

margin-bottom:18px;

letter-spacing:2px;

}

button{

width:100%;

padding:13px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

font-weight:bold;

transition:.3s;

}

.copy{

background:#00bfff;

color:white;

}

.copy:hover{

background:#0095cc;

}

.toast{

position:fixed;

bottom:30px;

right:30px;

background:#111;

padding:15px 25px;

border-radius:12px;

box-shadow:

0 0 20px rgba(0,195,255,.5);

opacity:0;

pointer-events:none;

transition:.35s;

}

.toast.show{

opacity:1;

transform:translateY(-10px);

}

@media(max-width:700px){

header h1{

font-size:28px;

}

.container{

padding:20px;

}

.card img{

height:220px;

}

}

</style>

</head>

const shop=document.getElementById("shop");
const toast=document.getElementById("toast");

function copyCode(code){

navigator.clipboard.writeText(code);

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},1800);

}

function render(){

const search=document
.getElementById("search")
.value
.toLowerCase();

const category=document
.getElementById("category")
.value;

shop.innerHTML="";

items
.filter(item=>{

const name=item.name
.toLowerCase()
.includes(search);

const cat=
category==="All" ||
item.category===category;

return name && cat;

})

.forEach(item=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

// Нажатие Enter в поиске обновляет список
document.getElementById("search").addEventListener("keydown", (e)=>{
    if(e.key==="Escape"){
        e.target.value="";
        render();
    }
});

// Небольшая анимация появления карточек
const observer = new MutationObserver(() => {

    const cards = document.querySelectorAll(".card");

    cards.forEach((card,index)=>{

        card.style.opacity="0";
        card.style.transform="translateY(25px)";

        setTimeout(()=>{

            card.style.transition=".35s";
            card.style.opacity="1";
            card.style.transform="translateY(0)";

        },index*70);

    });

});

observer.observe(shop,{
    childList:true
});
